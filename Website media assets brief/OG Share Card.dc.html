<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#05070D;font-family:'Work Sans',system-ui,sans-serif}
  a{color:#EF4444;text-decoration:none}
  a:hover{color:#F87171}
</style>
</helmet>
<div id="card" data-screen-label="og-share-card 1200x630" style="position:relative;width:1200px;height:630px;overflow:hidden;background:#0B1120;color:#fff;font-family:'Work Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 78% 62%, rgba(220,38,38,.20) 0%, rgba(220,38,38,0) 58%)"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(90% 70% at 18% 8%, rgba(94,124,190,.16) 0%, rgba(11,17,32,0) 60%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:290px;background:linear-gradient(to top,#080C16 0%,rgba(8,12,22,0) 100%)"></div>
  <div style="position:absolute;left:0;right:0;top:404px;height:1px;background:linear-gradient(90deg,rgba(220,38,38,0) 0%,rgba(220,38,38,.55) 46%,rgba(220,38,38,0) 100%);box-shadow:0 0 46px 10px rgba(220,38,38,.14)"></div>
  <div style="position:absolute;inset:0;opacity:.055;background:repeating-linear-gradient(-45deg,transparent 0 26px,#ffffff 26px 27px)"></div>

  <img src="assets/img/car-three-quarter.png" alt="" style="position:absolute;right:10px;bottom:74px;width:566px;height:auto;filter:drop-shadow(0 30px 42px rgba(0,0,0,.6))">

  <div style="position:absolute;left:64px;top:58px;width:520px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;background:#DC2626;border-radius:6px;transform:skewX(-8deg);display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:skewX(8deg)"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
      </div>
      <span style="font-family:'Outfit',sans-serif;font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:uppercase;color:#fff">School name</span>
    </div>

    <div style="font-family:'Outfit',sans-serif;font-weight:900;font-size:66px;line-height:.94;letter-spacing:-.038em;text-transform:uppercase;text-wrap:balance">
      Pass your<br>road test<br><span style="color:#EF4444">first try</span>
    </div>

    <div style="font-size:18px;line-height:1.5;color:#9FB0CC;max-width:430px">DMV-licensed instruction, dual-control cars, and examiner-route practice in your city.</div>
  </div>

  <div style="position:absolute;left:64px;bottom:52px;display:flex;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:9px;padding:11px 16px;border:1px solid rgba(255,255,255,.16);border-radius:6px;background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4.5 8-11V5l-8-3-8 3v6c0 6.5 8 11 8 11z"></path></svg>
      <span style="font-family:'Outfit',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:#DCE5F2">Dual controls</span>
    </div>
    <div style="display:flex;align-items:center;gap:9px;padding:11px 16px;border:1px solid rgba(255,255,255,.16);border-radius:6px;background:rgba(255,255,255,.04)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      <span style="font-family:'Outfit',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:#DCE5F2">DMV licensed</span>
    </div>
  </div>

  <div style="position:absolute;right:0;top:0;background:#DC2626;color:#fff;font-family:'Outfit',sans-serif;font-weight:900;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;padding:11px 22px">Book a lesson</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630}}"></script>
</body>
</html>
