<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#05070D}
  a{color:#EF4444;text-decoration:none}
  a:hover{color:#F87171}
</style>
<script>window.OM_SCENES = '[{"name":"Parallel park","dur":6}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
</helmet>
<div data-screen-label="parallel-park-topdown 1200x1200 / 6s loop" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#05070D">
  <x-import component-from-global-scope="ParallelParkPiece" from="./animations-v2.jsx ./parallel-park.jsx" hero-color="{{ heroColor }}" show-trail="{{ showTrail }}" show-guide="{{ showGuide }}" show-roof-sign="{{ showRoofSign }}" hint-size="1200px,1200px"></x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;heroColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#DC2626&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#DC2626&quot;,&quot;#EF4444&quot;,&quot;#F8FAFC&quot;,&quot;#5A6B85&quot;],&quot;section&quot;:&quot;Learner car&quot;},&quot;showRoofSign&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Learner car&quot;},&quot;showTrail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Instructional overlay&quot;},&quot;showGuide&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Instructional overlay&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      heroColor:    this.props.heroColor ?? '#DC2626',
      showTrail:    this.props.showTrail ?? true,
      showGuide:    this.props.showGuide ?? true,
      showRoofSign: this.props.showRoofSign ?? true
    };
  }
}
</script>
</body>
</html>
