name: Deploy previews

# One build and one Cloudflare Pages project serve every client.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — from the right-hand sidebar of the Cloudflare dashboard
#
# Optional repository variable:
#   PREVIEW_BASE           — the host the export is served from, e.g.
#                            https://epoches.pages.dev. Compiled into every
#                            canonical and og:url at BUILD time, so attaching a
#                            custom domain in the dashboard is not enough on its
#                            own — set this and rebuild. Defaults to the value in
#                            src/lib/seo.ts, which is the live pages.dev host.

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/deploy-previews.yml'
  workflow_dispatch:

concurrency:
  # The free plan allows one concurrent build. Queue rather than race.
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - name: Install
        working-directory: preview
        run: npm ci

      # The photograph manifest is committed because the typecheck and the tests
      # read it, but the WebP ladder it describes is not — it is regenerated by
      # the build below. This asserts the committed manifest still matches the
      # committed originals, so a photograph swapped without running
      # `npm run photos` fails here rather than shipping a stale ladder.
      - name: Check photo manifest
        working-directory: preview
        run: npm run photos:check

      - name: Typecheck
        working-directory: preview
        run: npx tsc --noEmit

      # Geometry and brand-contrast tests. The contrast suite is the reason this
      # gates the deploy rather than just running locally: it asserts every
      # client's palette clears WCAG AA where it carries text, and it has already
      # caught one brand three thousandths under the line after hex rounding.
      - name: Test
        working-directory: preview
        run: npx vitest run

      # `npm run build`, not `npx next build`: the build script derives the
      # photograph ladder first, and the export references only derived files.
      - name: Build static export
        working-directory: preview
        env:
          NEXT_PUBLIC_PREVIEW_BASE: ${{ vars.PREVIEW_BASE }}
        run: npm run build

      # One audit over the whole export, replacing the two inline checks that
      # used to live here. It covers everything they did and more:
      #
      #   - every page carries noindex     (a preview must never compete with
      #     the real business's own site in search)
      #   - every image reference resolves (a typo is a broken image on a page
      #     we are asking someone to judge us by)
      #   - no page borrows shared stock photography
      #   - every internal link resolves
      #   - every page has a title, a lang attribute and exactly one h1
      #   - every img has an alt attribute
      #   - no duplicate element ids
      #
      # Source: research/tools/audit-static.py. Exits non-zero on any failure.
      - name: Audit the built export
        run: python3 research/tools/audit-static.py preview/out

      # Is there anything to deploy WITH?
      #
      # This workflow failed on every run from the day it was added — nine of
      # them — and every failure was this step, with the build, the tests and the
      # audit above all green. A wall of red mail for a missing credential trains
      # you to ignore the one alert that will eventually matter, and it hid the
      # fact that the previews were only ever live because they were deployed by
      # hand.
      #
      # A missing secret is a configuration state, not a broken build. It is
      # reported in the run summary and the deploy is skipped. If the secrets ARE
      # present, nothing below changes: a genuine deploy failure still fails the
      # run, which is the alert worth keeping.
      - name: Check deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          have_token=$([ -n "${CF_TOKEN}" ] && echo yes || echo no)
          have_account=$([ -n "${CF_ACCOUNT}" ] && echo yes || echo no)
          if [ "$have_token" = yes ] && [ "$have_account" = yes ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo '### Deploying' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          {
            echo '### Deployment skipped — no Cloudflare credentials'
            echo
            echo 'The export built and passed every check. Nothing was published.'
            echo
            echo '| secret | set |'
            echo '|---|---|'
            echo "| \`CLOUDFLARE_API_TOKEN\` | ${have_token} |"
            echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ${have_account} |"
            echo
            echo 'Add them under **Settings → Secrets and variables → Actions**. The token needs'
            echo '**Cloudflare Pages: Edit**, and it must belong to the account that owns the'
            echo '`epoches` Pages project.'
            echo 'these previews live on the personal account and NOT the Epoches company one.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy preview/out --project-name=epoches --branch=main

      # The export is worth keeping even when it cannot be published: it is the
      # thing that would have been deployed, and it can be dragged straight into
      # the Cloudflare dashboard.
      - name: Keep the export when it could not be deployed
        if: steps.creds.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-export
          path: preview/out
          retention-days: 7
